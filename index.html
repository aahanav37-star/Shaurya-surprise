<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Munni ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Georgia, serif;
            background: linear-gradient(135deg, #ffd6e5, #ff9eb8, #8b1025);
            color: white;
        }

        .box {
            padding: 40px 25px;
            max-width: 600px;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #a7193b;
            font-size: 17px;
            cursor: pointer;
        }

        .heart {
            font-size: 50px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            50% {
                transform: scale(1.2);
            }
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="heart">❤️</div>

        <h1>Happy Boyfriend's Day, My Love</h1>

        <p>
            A little surprise for you, Munni...
        </p>

        <button onclick="alert('I love you, Shaurya ❤️')">
            ♡ Open Your Surprise ♡
        </button>

        <p>
            Made with love by Aahana.
        </p>

    </div>

</body>
  </html>
