<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Munni ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, "Times New Roman", serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.25), transparent 25%),
                radial-gradient(circle at 80% 80%, rgba(255,150,180,0.25), transparent 30%),
                linear-gradient(145deg, #ffccd9, #e85d7f 48%, #7d1029);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 5;
            animation: appear 1.5s ease;
        }

        .small-heart {
            font-size: 48px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
            filter: drop-shadow(0 4px 10px rgba(120,0,30,0.3));
        }

        .little-line {
            width: 70px;
            height: 1px;
            background: rgba(255,255,255,0.7);
            margin: 18px auto;
        }

        h1 {
            font-size: clamp(32px, 8vw, 55px);
            line-height: 1.08;
            margin: 10px 0;
            font-weight: normal;
            letter-spacing: 1px;
            text-shadow: 0 5px 20px rgba(90,0,30,0.25);
        }

        .subtitle {
            font-size: 20px;
            font-style: italic;
            margin: 18px 0 5px;
            opacity: 0.95;
        }

        .name {
            font-size: 28px;
            margin-top: 5px;
            letter-spacing: 3px;
        }

        .button {
            margin-top: 35px;
            padding: 16px 30px;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 50px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 17px;
            font-family: Georgia, serif;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(80,0,20,0.2);
        }

        .button:hover {
            background: white;
            color: #a51d45;
            transform: translateY(-3px);
        }

        .from {
            margin-top: 35px;
            font-size: 14px;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        /* Floating hearts */

        .heart {
            position: absolute;
            bottom: -40px;
            font-size: 18px;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        .heart:nth-child(1) {
            left: 10%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .heart:nth-child(2) {
            left: 25%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .heart:nth-child(3) {
            left: 45%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .heart:nth-child(4) {
            left: 65%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart:nth-child(5) {
            left: 82%;
            animation-duration: 11s;
            animation-delay: 4s;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.7);
                opacity: 0;
            }

            15% {
                opacity: 0.6;
            }

            100% {
                transform: translateY(-110vh) scale(1.3) rotate(20deg);
                opacity: 0;
            }
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>
    <div class="heart">♥</div>
    <div class="heart">♡</div>

    <div class="container">

        <div class="small-heart">♡</div>

        <div class="little-line"></div>

        <h1>
            Happy Boyfriend's Day,<br>
            My Love
        </h1>

        <p class="subtitle">
            A little surprise for you...
        </p>

        <div class="name">
            Munni ❤️
        </div>

        <button class="button" onclick="openSurprise()">
            Open My Heart ♡
        </button>

        <div class="from">
            Made with love by Aahana
        </div>

    </div>

    <script>
        function openSurprise() {
            alert("I love you, Shaurya ❤️");
        }
    </script>

</body>
    </html>
