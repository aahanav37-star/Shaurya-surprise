<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Munni ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #f8dce3;
    color: #5b1729;
    font-family: Georgia, "Times New Roman", serif;
}

section {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

/* ---------- OPENING ---------- */

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;
    background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.28), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(255,180,200,.25), transparent 28%),
        linear-gradient(145deg, #ffd6e0, #e85d7f 48%, #75142d);
}

.hero-content {
    max-width: 650px;
    animation: fadeUp 1.5s ease;
}

.mini-heart {
    font-size: 48px;
    animation: heartbeat 1.6s infinite;
}

.eyebrow {
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    opacity: .85;
    margin-top: 22px;
}

.hero h1 {
    font-size: clamp(42px, 10vw, 70px);
    line-height: 1;
    font-weight: normal;
    margin: 18px 0;
}

.hero h1 span {
    font-style: italic;
}

.hero-subtitle {
    font-size: 19px;
    font-style: italic;
    opacity: .9;
}

.hero-name {
    font-size: 28px;
    letter-spacing: 5px;
    margin-top: 12px;
}

.open-btn {
    margin-top: 35px;
    padding: 16px 32px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,.8);
    background: rgba(255,255,255,.15);
    color: white;
    font-family: Georgia, serif;
    font-size: 16px;
    backdrop-filter: blur(10px);
    cursor: pointer;
    transition: .3s;
}

.open-btn:hover {
    background: white;
    color: #8c1735;
    transform: translateY(-3px);
}

/* ---------- GENERAL ---------- */

.inner {
    width: min(900px, 90%);
    margin: auto;
    padding: 90px 0;
}

.section-label {
    text-align: center;
    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #a23a57;
}

.section-title {
    text-align: center;
    font-size: clamp(38px, 8vw, 58px);
    font-weight: normal;
    margin: 12px 0 50px;
}

.section-title em {
    font-weight: normal;
}

/* ---------- STORY ---------- */

.story {
    background:
        radial-gradient(circle at 90% 10%, #f6b8c8, transparent 25%),
        #f8dce3;
}

.story-intro {
    max-width: 600px;
    margin: auto;
    text-align: center;
    font-size: 19px;
    line-height: 1.8;
    color: #713047;
}

.chapter {
    margin: 55px auto;
    max-width: 680px;
    padding: 34px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 30px;
    box-shadow: 0 15px 45px rgba(100,25,50,.09);
    backdrop-filter: blur(12px);
